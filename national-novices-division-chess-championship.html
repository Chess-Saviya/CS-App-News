<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Lanka National Novices Division Chess Championships</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables for Branding */
        :root {
            --brand-color: #0062FF;
            --brand-color-hover: #004ecb;
            --text-dark: #1a1a1a;
            --text-gray: #4a4a4a;
            --bg-light: #f8f9fa;
            --white: #ffffff;
            --border-radius: 12px;
            --error-color: #d32f2f;
        }

        /* Global Resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            font-family: 'Poppins', 'Noto Serif Sinhala', serif;
        }

        /* Container styling */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: var(--white);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Typography */
        h1 {
            font-family: 'Poppins', sans-serif;
            color: var(--brand-color);
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            line-height: 1.3;
        }

        h2 {
            font-family: 'Noto Serif Sinhala', serif;
            color: var(--text-dark);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        p {
            font-family: 'Noto Serif Sinhala', serif;
            font-size: 1.1rem;
            color: var(--text-gray);
            margin-bottom: 15px;
        }

        /* Search Section */
        .search-section {
            background: #f0f7ff;
            padding: 30px;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        .search-label {
            display: block;
            margin-bottom: 15px;
            font-family: 'Noto Serif Sinhala', serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .search-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            /* Default alignment for Desktop */
            align-items: center; 
        }

        select {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            min-width: 250px;
            background-color: white;
            cursor: pointer;
            height: 50px; /* Enforce height to match button */
        }

        select:focus {
            outline: none;
            border-color: var(--brand-color);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            background-color: var(--brand-color);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 98, 255, 0.3);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            /* Default margin for Mobile logic */
            margin-top: 15px; 
            height: 50px; /* Enforce height to match select */
            line-height: 26px; /* Vertical center text fix */
        }

        /* Specific fix for the Search button inside controls on Desktop */
        @media (min-width: 601px) {
            .search-controls .btn {
                margin-top: 0; /* Remove margin on desktop to align with select */
            }
        }

        .btn:hover {
            background-color: var(--brand-color-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 98, 255, 0.4);
        }

        .btn-whatsapp {
            background-color: #25D366;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            /* Reset margin for regular content links if needed */
            margin-top: 15px; 
        }
        
        .btn-whatsapp:hover {
            background-color: #1ebc57;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* Inline Error Message */
        .error-message {
            color: var(--error-color);
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            width: 100%;
        }

        /* --- DASHBOARD (Initial View) --- */
        #dashboard-area {
            display: block;
            margin-top: 10px;
            text-align: center;
        }

        .dashboard-title {
            font-family: 'Noto Serif Sinhala', serif;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            display: inline-block;
        }

        .active-districts-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .active-districts-list li {
            font-family: 'Poppins', sans-serif;
            background: #fff;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        .dashboard-full-msg {
            font-family: 'Noto Serif Sinhala', serif;
            font-size: 1.2rem;
            color: var(--brand-color);
            font-weight: 600;
            padding: 20px;
            background: #f0f7ff;
            border-radius: 8px;
        }

        /* --- RESULT AREA --- */
        #result-area {
            display: none; /* Hidden by default */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .district-header {
            text-align: center;
            font-family: 'Noto Serif Sinhala', serif;
            font-size: 1.5rem;
            color: var(--brand-color);
            font-weight: 700;
            margin-bottom: 30px;
        }

        .result-block {
            text-align: center;
            margin-top: 10px;
        }

        .cta-group {
            margin-bottom: 40px;
        }

        .cta-text {
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Image Grid */
        .image-grid {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 15px;
            margin: 25px 0 40px 0;
        }

        .image-grid img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .image-grid img:hover {
            transform: scale(1.02);
        }

        /* Pending Box (Not Found) */
        .pending-box {
            border: 1px solid #000; /* Black Border */
            background-color: #fff;
            color: #000; /* Black Text */
            padding: 30px;
            border-radius: var(--border-radius);
            text-align: center;
            font-family: 'Noto Serif Sinhala', serif;
            font-weight: 600;
            font-size: 1.2rem;
            margin-top: 20px;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: auto;
            padding-top: 40px;
            border-top: 1px solid #eee;
            color: #888;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
        }

        /* Bottom Spacer */
        .bottom-spacer {
            height: 3rem;
            width: 100%;
            flex-shrink: 0;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.7rem;
                margin-bottom: 30px;
            }
            
            .search-controls {
                flex-direction: column;
                align-items: center; /* Keep centered in column mode */
            }
            
            select {
                width: 100%;
            }

            .btn {
                width: 100%;
                margin-top: 15px; /* Ensure margin exists on mobile */
            }
        }
    </style>
</head>
<body>

                            </div>

                            <div class="cta-group">
                                <p class="cta-text">පහතින් තරඟාවලියේ ${data.nameSi} දිස්ත්‍රික්කයට අදාළ WhatsApp සමූහයට එකතු වෙන්න.</p>
                                <a href="${data.whatsapp}" target="_blank" class="btn btn-whatsapp">Join WhatsApp Group >></a>
                            </div>

                            <div class="image-grid">
                                <img src="${data.img1}" alt="${selectedValue} Tournament Details Front">
                                <img src="${data.img2}" alt="${selectedValue} Tournament Details Back">
                            </div>

                            <div class="cta-group">
                                <a href="${data.pdf}" target="_blank" class="btn">Download PDF</a>
                            </div>
                        </div>
                    `;
                } else {
                    // --- Render Not Available Message (Black text/border) ---
                    htmlContent = `
                        <div class="pending-box">
                            ${data.nameSi} දිස්ත්‍රික්කය සඳහා මෙතෙක් තරඟාවලියට අදාළ තොරතුරු ඇතුළත් වී නොමැත.
                        </div>
                    `;
                }

                // Inject and Show
                resultArea.innerHTML = htmlContent;
                resultArea.style.display = 'block';
            });
        });
    </script>

</body>
</html>
